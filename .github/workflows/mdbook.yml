name: Deploy MdBook
on:
  push:
    branches:
      - main

# Allow only one concurrent Pages deployment. Don't cancel in-progress runs:
# let the active deployment finish, but supersede any queued run so rapid
# merges to main can't race each other in the deploy-pages step.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # To push a branch
      pages: write  # To push to a GitHub Pages site
      id-token: write # To update the deployment status
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install mdbook
        env:
          # Pin the release and checksum together: deployments must not depend on
          # the unauthenticated GitHub "latest release" API or change implicitly.
          MDBOOK_VERSION: v0.5.4
          MDBOOK_SHA256: 3f28de05dafca9d0f2eab99c662116b0e37b89b1d96a08f8f430b9eeae958cd7
        shell: bash
        run: |
          set -euo pipefail
          url="https://github.com/rust-lang/mdbook/releases/download/${MDBOOK_VERSION}/mdbook-${MDBOOK_VERSION}-x86_64-unknown-linux-gnu.tar.gz"
          install_dir="${RUNNER_TEMP}/mdbook"
          archive="${RUNNER_TEMP}/mdbook.tar.gz"
          mkdir -p "$install_dir"
          curl --fail --show-error --silent --location --retry 3 \
            --connect-timeout 15 --max-time 120 "$url" --output "$archive"
          echo "${MDBOOK_SHA256}  ${archive}" | sha256sum --check --strict
          tar -xzf "$archive" --directory="$install_dir"
          "$install_dir/mdbook" --version
          echo "$install_dir" >> "$GITHUB_PATH"
      - name: Replace crate version
        run: |
          THIRTYFOUR_VERSION=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "thirtyfour") | .version')
          cd docs
          find src/ -name '*.md' -exec sed -i "s/THIRTYFOUR_CRATE_VERSION/${THIRTYFOUR_VERSION}/g" {} \;
      - name: Build Book
        run: |
          # This assumes your book is in the root of your repository.
          # Just add a `cd` here if you need to change to another directory.
          cd docs
          mdbook build
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: 'docs/book'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
